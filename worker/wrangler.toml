name = "trustio-optin"
main = "src/index.js"
compatibility_date = "2026-09-22"

# Endereços públicos, sem segredo nenhum. Os segredos entram por `wrangler secret put`.
[vars]
SITE_URL = "https://trustio.com.br"
API_URL = "https://api.trustio.com.br"
EMAIL_FROM = "Trustio <no-reply@send.trustio.com.br>"
SUPABASE_URL = "https://mjdaluioyutnxlyomzyd.supabase.co"

# Segredos, definidos uma vez por linha de comando (ver README.md):
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put RESEND_API_KEY

[[routes]]
pattern = "api.trustio.com.br/*"
zone_name = "trustio.com.br"
