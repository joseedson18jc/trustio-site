<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070a">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Página não encontrada | Trustio</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="error-page">
  <main class="error-shell">
    <div class="error-dots" aria-hidden="true"></div>
    <a class="brand" href="index.html" aria-label="Trustio, página inicial">
      <img class="brand-mark" src="assets/trustio-mark.svg" alt="" width="34" height="34">
      <span class="brand-word"><span>Trust</span><strong>io</strong></span>
    </a>
    <div class="error-content">
      <p class="eyebrow">ERRO / 404</p>
      <h1>Página não encontrada.</h1>
      <p>O endereço informado não existe ou foi movido.</p>
      <a class="button button-primary" href="index.html">Voltar ao início <span aria-hidden="true">→</span></a>
    </div>
    <div class="error-footer">
      <p class="error-code">TRUSTIO / SAFE ROUTE</p>
      <div class="iso-badge">
        <img src="assets/iso-27001.png" alt="Certificação ISO 27001" height="30">
        <img src="assets/anpd.png" alt="ANPD — Autoridade Nacional de Proteção de Dados" height="30">
        <img src="assets/lgpd.png" alt="LGPD — Lei Geral de Proteção de Dados" height="30">
        <div class="iso-badge-text">
          <span>ISO 27001 · LGPD · ANPD</span>
          <a href="https://github.com/joseedson18jc/trustio-site/blob/main/SECURITY.md" target="_blank" rel="noopener">Acompanhamento de segurança</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
