name: Trustio delivery audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect notification configuration without customer data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TEST_CONFIG: ${{ secrets.TRUSTIO_DELIVERY_TEST }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-0-sa-east-1.pooler.supabase.com
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.mjdaluioyutnxlyomzyd
          PGSSLMODE: require
          PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=30000'
        run: |
          set -euo pipefail
          python3 <<'PYCODE'
          import os,json,urllib.request,urllib.error,subprocess
          cfg=json.loads(os.environ['TEST_CONFIG'])
          def get(url,key):
            try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+key.strip().strip(chr(34)).strip(chr(39))}),timeout=25)
              return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e:return e.code,{}
          ref='mjdaluioyutnxlyomzyd'
          status,auth=get('https://api.supabase.com/v1/projects/'+ref+'/config/auth',os.environ['SUPABASE_ACCESS_TOKEN'])
          print('AUTH_CONFIG '+json.dumps({'status':status,**{k:auth.get(k) for k in ['smtp_host','smtp_port','smtp_user','smtp_admin_email','smtp_sender_name','mailer_autoconfirm','site_url','rate_limit_email_sent']}}))
          for name in ['RESEND_API_KEY','SMTP_PASS']:
            key=os.environ.get(name,'')
            if not key:print('RESEND '+json.dumps({'key_source':name,'configured':False}));continue
            status,d=get('https://api.resend.com/emails?limit=100',key)
            rows=[{'id':x.get('id'),'subject':x.get('subject'),'last_event':x.get('last_event'),'created_at':x.get('created_at')}for x in d.get('data',[])if cfg['email'] in x.get('to',[])]
            print('RESEND '+json.dumps({'key_source':name,'status':status,'test_emails':rows}))
          sql="""select json_build_object(
          'target', (select row_to_json(t) from (select id, user_id, confirmed_at is not null as confirmed,whatsapp_trial_status,whatsapp_ativacao,whatsapp_aviso_email_em,whatsapp_aviso_email_erro,whatsapp_aviso_wa_em,whatsapp_aviso_wa_erro from public.crm_leads where user_id=:'test_user_id'::uuid) t),
          'vault_config', (select json_agg(json_build_object('name',name,'configured',length(decrypted_secret)>0))from vault.decrypted_secrets where name in ('aviso_agente_url','aviso_agente_segredo')),
          'notification_trigger',(select tgenabled from pg_trigger where tgname='crm_leads_whatsapp_aviso'),
          'agent_number_configured',(select length(regexp_replace(value #>> '{}','[^0-9]','','g'))>=12 from public.app_settings where key='hermes_numero'));
          """
          subprocess.run(['docker','pull','postgres:17'],check=True,stdout=subprocess.DEVNULL)
          command=['docker','run','--rm','-i']
          for key in ['PGPASSWORD','PGHOST','PGPORT','PGDATABASE','PGUSER','PGSSLMODE','PGOPTIONS']:command+=['--env',key]
          command+=['postgres:17','psql','--no-psqlrc','--tuples-only','--no-align','--set','ON_ERROR_STOP=1','--set','test_user_id='+cfg['user_id']]
          r=subprocess.run(command,input=sql,text=True,capture_output=True,check=True)
          print('NOTIFICATION_CONFIG '+r.stdout.strip())
          PYCODE
