  { pattern = "trustio.com.br/crm*", zone_name = "trustio.com.br" },
  { pattern = "www.trustio.com.br/app*", zone_name = "trustio.com.br" },
  { pattern = "www.trustio.com.br/en/app*", zone_name = "trustio.com.br" },
  { pattern = "www.trustio.com.br/admin*", zone_name = "trustio.com.br" },
  { pattern = "www.trustio.com.br/crm*", zone_name = "trustio.com.br" },
