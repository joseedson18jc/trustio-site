# Aplica automaticamente a configuração do Supabase (auth, e-mails, SMTP, migrações, função de chat,
# segredos e administradores) a cada push na main que toque em supabase/. Também roda à mão.
#
# Secrets do repositório (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com/dashboard/account/tokens)    obrigatório
#   SUPABASE_DB_PASSWORD   senha do banco do projeto (Project Settings → Database)  obrigatório
#   SMTP_PASS              senha/API key do SMTP do domínio (ex.: Resend)           para e-mails pelo domínio
#   SMTP_SENDER            remetente, se diferente do padrão do config.toml         opcional
#   LLM_API_KEY            chave do provedor do modelo (xAI ou compatível)          para o chat responder
#   LLM_BASE_URL, LLM_MODEL                                                         opcionais
#   LLM_SERVIDOR           "llama.cpp" para a contagem exata de tokens               opcional
#   LLM_CONTEXTO           contexto do modelo (llama-server -c), ex.: 8192           opcional (% da sessão)
#   LLM_MAX_TOKENS         teto de tokens por resposta, ex.: 8192                    opcional (% da resposta)
#   AVISOS_SEGREDO         segredo compartilhado entre o banco (Vault) e a função aviso-agente  para os avisos do teste
#   RESEND_API_KEY         chave do Resend (e-mail do aviso do teste do Agentio)     para o aviso por e-mail
#   EVOLUTION_URL, EVOLUTION_INSTANCE, EVOLUTION_API_KEY  Evolution API                para o aviso por WhatsApp
#   EVOLUTION_NUMERO       número conectado à instância, se for o próprio Agentio    opcional
#   HERMES_SEGREDO         segredo do sincronizador do Mac (~/.trustio-hermes-sync-key) para liberar números no Hermes
#   ADMIN_EMAILS           e-mails dos administradores do CRM, separados por vírgula
name: Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml", "scripts/configure-email-tracking.py", "scripts/verify-email-tracking.py", "scripts/configure-admin-notifications.py"]
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

# O job só lê o repositório; o GITHUB_TOKEN não precisa de escrita.
permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # Cada segredo entra só no passo que o usa: as actions de terceiros (checkout, setup-cli)
    # rodam sem nenhum deles no ambiente.
    env:
      PROJECT_REF: mjdaluioyutnxlyomzyd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0

      - name: Verificar segredos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Faltam secrets:$missing (veja o cabeçalho deste workflow)"; exit 1; fi

          # O token pessoal do Supabase começa com sbp_. Colado pela interface, às vezes vem
          # com espaço, quebra de linha ou aspas; tiramos. Se ainda não for sbp_, dizemos
          # que tipo de chave chegou (sem mostrar nada dela), porque o erro da CLI não diz.
          token="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d "[:space:]\"'")"
          case "$token" in
            sbp_*) ;;
            sb_secret_*) tipo="a chave secreta do projeto (sb_secret_…)" ;;
            sb_publishable_*) tipo="a chave publishable do projeto (sb_publishable_…)" ;;
            eyJ*) tipo="uma chave JWT do projeto (anon ou service_role, eyJ…)" ;;
            *) tipo="um valor que não é token do Supabase" ;;
          esac
          if [ -n "${tipo:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN recebeu $tipo. O workflow precisa do token pessoal da conta, que começa com sbp_: supabase.com/dashboard/account/tokens → Generate new token."
            exit 1
          fi
          if [ "$token" != "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN tinha espaço, quebra de linha ou aspas; foram removidos nesta execução. Corrija também o secret, colando só o sbp_…"
          fi
          # Os passos seguintes (só `run:`, nenhuma action de terceiro) recebem o token limpo daqui.
          echo "::add-mask::$token"
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

          [ -n "$SMTP_PASS" ] || echo "::warning::SMTP_PASS ausente: e-mails seguem pelo remetente padrão do Supabase (limite de poucos por hora)."
          [ -n "$LLM_API_KEY" ] || echo "::warning::LLM_API_KEY ausente: o chat responde 'modelo não ativado' até a chave existir."

      - name: Vincular projeto
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar migrações (banco)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Aplicar configuração de Auth, e-mails e SMTP
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            # Sem o cliente OAuth do Google, o provedor fica desligado (o botão responde com erro amigável).
            # Como o SMTP: env() sem valor faz o `config push` falhar, então os campos vão vazios.
            sed -i 's/^enabled = true # login com Google$/enabled = false/' supabase/config.toml
            sed -i 's|^client_id = "env(GOOGLE_CLIENT_ID)"$|client_id = ""|' supabase/config.toml
            sed -i 's|^secret = "env(GOOGLE_CLIENT_SECRET)"$|secret = ""|' supabase/config.toml
            echo "::warning::GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET ausentes: login com Google desligado."
          fi
          if [ -z "$SMTP_PASS" ]; then
            # Sem senha de SMTP, mantém o remetente padrão para não quebrar o envio.
            sed -i 's/^enabled = true$/enabled = false/' supabase/config.toml
            sed -i 's|^pass = "env(SMTP_PASS)"$|pass = ""|' supabase/config.toml
          elif [ -n "$SMTP_SENDER" ]; then
            # O provedor só aceita enviar de domínio verificado na conta dele.
            sed -i "s|^admin_email = .*|admin_email = \"$SMTP_SENDER\"|" supabase/config.toml
          fi
          echo "Remetente que será aplicado: $(grep '^admin_email' supabase/config.toml)"
          echo "::notice::Se os e-mails não chegarem, confira se esse domínio está verificado no provedor de SMTP."
          supabase config push --yes

      - name: Publicar função de chat
        run: supabase functions deploy chat --project-ref "$PROJECT_REF"

      - name: Publicar função de aviso do teste do Agentio
        run: supabase functions deploy aviso-agente --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Publicar função de convite de retorno do CRM
        run: supabase functions deploy crm-convite --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Publicar acompanhamento de e-mails
        run: supabase functions deploy email-eventos --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Publicar avisos de novos cadastros e assinantes
        run: supabase functions deploy admin-avisos --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Configurar e-mail do convite de retorno
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # A senha do SMTP Resend é uma API key; reutiliza a integração já configurada.
          key="$RESEND_API_KEY"
          if [ -z "$key" ]; then
            case "$SMTP_PASS" in re_*) key="$SMTP_PASS" ;; esac
          fi
          [ -n "$key" ] || { echo "::error::Configure RESEND_API_KEY ou a API key do Resend em SMTP_PASS para os convites do CRM."; exit 1; }
          sender="${SMTP_SENDER:-no-reply@send.trustio.com.br}"
          f=$(mktemp); chmod 600 "$f"; trap 'rm -f "$f"' EXIT
          export RESEND_API_KEY="$key" EMAIL_FROM="Trustio <$sender>" SECRET_FILE="$f"
          python3 - <<'PY'
          import os, json
          with open(os.environ['SECRET_FILE'], 'w') as f:
              for name in ['RESEND_API_KEY', 'EMAIL_FROM']:
                  f.write(name + '=' + json.dumps(os.environ[name]) + '\n')
          PY
          python3 scripts/configure-email-tracking.py "$f"
          python3 scripts/configure-admin-notifications.py "$f"
          supabase secrets set --env-file "$f" --project-ref "$PROJECT_REF"
          echo "E-mail do CRM configurado com o remetente do domínio."

      - name: Validar entrega e webhook em caixa simulada
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 scripts/verify-email-tracking.py

      - name: Publicar função de números autorizados do Hermes
        run: supabase functions deploy hermes-autorizados --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Definir segredos da função de aviso
        env:
          AVISOS_SEGREDO: ${{ secrets.AVISOS_SEGREDO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVOLUTION_URL: ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_NUMERO: ${{ secrets.EVOLUTION_NUMERO }}
          HERMES_SEGREDO: ${{ secrets.HERMES_SEGREDO }}
        run: |
          # Os valores vão num arquivo 600, não na linha de comando (argv aparece em listagens de
          # processo e quebra com espaço ou caractere especial).
          f=$(mktemp); chmod 600 "$f"; trap 'rm -f "$f"' EXIT
          for v in AVISOS_SEGREDO RESEND_API_KEY EVOLUTION_URL EVOLUTION_INSTANCE EVOLUTION_API_KEY EVOLUTION_NUMERO HERMES_SEGREDO; do
            val="${!v}"; [ -n "$val" ] || continue
            val="${val//\\/\\\\}"; val="${val//\"/\\\"}"
            printf '%s="%s"\n' "$v" "$val" >> "$f"
          done
          [ -s "$f" ] || { echo "Nenhum segredo de aviso definido; pulando."; exit 0; }
          supabase secrets set --env-file "$f" --project-ref "$PROJECT_REF"

      - name: Definir segredos da função
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_SERVIDOR: ${{ secrets.LLM_SERVIDOR }}
          LLM_CONTEXTO: ${{ secrets.LLM_CONTEXTO }}
          LLM_MAX_TOKENS: ${{ secrets.LLM_MAX_TOKENS }}
        run: |
          [ -n "$LLM_API_KEY" ] || { echo "LLM_API_KEY ausente; pulando."; exit 0; }
          f=$(mktemp); chmod 600 "$f"; trap 'rm -f "$f"' EXIT
          for v in LLM_API_KEY LLM_BASE_URL LLM_MODEL LLM_SERVIDOR LLM_CONTEXTO LLM_MAX_TOKENS; do
            val="${!v}"; [ -n "$val" ] || continue
            val="${val//\\/\\\\}"; val="${val//\"/\\\"}"
            printf '%s="%s"\n' "$v" "$val" >> "$f"
          done
          supabase secrets set --env-file "$f" --project-ref "$PROJECT_REF"

      - name: Administradores do CRM
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          [ -n "$ADMIN_EMAILS" ] || { echo "ADMIN_EMAILS ausente; pulando."; exit 0; }
          list=$(echo "$ADMIN_EMAILS" | tr ',' '\n' | sed "s/^ *//;s/ *$//;/^$/d;s/.*/'\\L&'/" | paste -sd, -)
          # db.<ref>.supabase.co só responde por IPv6, que o runner do GitHub não tem: vai pelo
          # pooler (IPv4, modo sessão), o mesmo que o `supabase db push` usa. A senha vai por
          # PGPASSWORD para não quebrar a URL se tiver caractere especial.
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "host=aws-0-sa-east-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.${PROJECT_REF} sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "insert into public.admins (user_id) select id from auth.users where lower(email) in ($list) on conflict do nothing;" \
            -c "select email from auth.users where lower(email) in ($list);"
          echo "Contas que ainda não existem no Auth só viram admin depois de se cadastrarem; rode o workflow de novo."
