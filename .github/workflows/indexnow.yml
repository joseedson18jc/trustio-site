# Avisa os buscadores do IndexNow (Bing, Yandex, Seznam, Naver…) quando páginas do site mudam
# na main. O índice do Bing também alimenta a busca do ChatGPT, o Copilot e o DuckDuckGo.
# Sem segredos: a chave é pública por definição (arquivo <chave>.txt na raiz do site).
name: IndexNow

on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:
    inputs:
      todas:
        description: "Avisar todas as URLs do sitemap (não só as alteradas)"
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O GitHub Pages publica depois do push: o script espera a chave e cada página alterada
      # no ar (deploy posterior ao commit; apagada respondendo 404) antes de avisar, senão o
      # buscador rastreia a versão antiga.
      - name: Avisar o IndexNow
        timeout-minutes: 20
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.todas }}" = "true" ]; then
            node scripts/indexnow.mjs --all --wait
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/indexnow.mjs --changed "${{ github.event.before }}" "${{ github.sha }}" --wait
          else
            node scripts/indexnow.mjs --changed HEAD~1 HEAD --wait
          fi
